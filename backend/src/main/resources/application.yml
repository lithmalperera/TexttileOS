spring:
  application:
    name: textile-manufacturing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/textile}
    username: ${DB_USERNAME:textile}
    password: ${DB_PASSWORD:textile-local-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    root: INFO
